<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OmniOTP - Drop-In Website OTP Widget Example</title>
  <style>
    /* -------------------------------------------------------------
     * OmniOTP Drop-in Modal Styles
     * ----------------------------------------------------------- */
    :root {
      --omni-primary: #00d2ff;
      --omni-success: #10b981;
      --omni-bg: #0d1424;
      --omni-card: #151f35;
      --omni-text: #f8fafc;
      --omni-muted: #94a3b8;
      --omni-border: rgba(255, 255, 255, 0.1);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #080c15;
      color: var(--omni-text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 1rem;
    }

    .omni-demo-card {
      background: var(--omni-card);
      border: 1px solid var(--omni-border);
      border-radius: 16px;
      padding: 2.5rem;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
      text-align: center;
    }

    .omni-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(0, 210, 255, 0.1);
      color: var(--omni-primary);
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
      margin-bottom: 1rem;
    }

    .omni-title {
      font-size: 1.5rem;
      font-weight: 700;
      margin: 0 0 0.5rem 0;
    }

    .omni-subtitle {
      color: var(--omni-muted);
      font-size: 0.875rem;
      margin: 0 0 1.5rem 0;
      line-height: 1.4;
    }

    .omni-input-group {
      text-align: left;
      margin-bottom: 1.25rem;
    }

    .omni-label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 0.4rem;
      color: var(--omni-text);
    }

    .omni-input {
      width: 100%;
      box-sizing: border-box;
      padding: 0.85rem 1rem;
      background: #090e1a;
      border: 1px solid var(--omni-border);
      border-radius: 10px;
      color: #fff;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .omni-input:focus {
      border-color: var(--omni-primary);
      box-shadow: 0 0 0 2px rgba(0, 210, 255, 0.2);
    }

    .omni-otp-input {
      letter-spacing: 0.5rem;
      font-size: 1.5rem;
      font-weight: 700;
      text-align: center;
      color: var(--omni-primary);
      font-family: monospace;
    }

    .omni-btn {
      width: 100%;
      padding: 0.9rem;
      border: none;
      border-radius: 10px;
      background: var(--omni-primary);
      color: #080c15;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: transform 0.15s, opacity 0.2s;
    }

    .omni-btn:hover {
      opacity: 0.92;
      transform: translateY(-1px);
    }

    .omni-btn-success {
      background: var(--omni-success);
      color: #fff;
    }

    .omni-timer-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 1rem;
      font-size: 0.8rem;
      color: var(--omni-muted);
    }

    .omni-resend-btn {
      background: transparent;
      border: none;
      color: var(--omni-primary);
      cursor: pointer;
      font-weight: 600;
      padding: 0;
    }

    .omni-resend-btn:disabled {
      color: var(--omni-muted);
      cursor: not-allowed;
    }

    .omni-alert {
      padding: 0.75rem;
      border-radius: 8px;
      font-size: 0.8rem;
      margin-top: 1rem;
      display: none;
    }
    .omni-alert.success { background: rgba(16, 185, 129, 0.15); color: #34d399; display: block; }
    .omni-alert.error { background: rgba(244, 63, 94, 0.15); color: #f87171; display: block; }
  </style>
</head>
<body>

  <div class="omni-demo-card">
    <div class="omni-badge">⚡ OmniOTP Cloud Integration</div>
    <h2 class="omni-title">Sign In with Mobile</h2>
    <p class="omni-subtitle">We will send an SMS verification code to your mobile phone.</p>

    <!-- STEP 1: ENTER PHONE NUMBER -->
    <div id="omni-step-phone">
      <div class="omni-input-group">
        <label class="omni-label">Mobile Number</label>
        <input type="tel" id="omni-phone" class="omni-input" placeholder="e.g. 9876543210 or +919876543210" required>
      </div>
      <button type="button" id="omni-btn-send" class="omni-btn">Send Verification OTP</button>
    </div>

    <!-- STEP 2: ENTER OTP CODE -->
    <div id="omni-step-verify" style="display: none;">
      <div class="omni-input-group">
        <label class="omni-label">Enter 6-Digit Passcode</label>
        <input type="text" id="omni-otp" class="omni-input omni-otp-input" maxlength="6" placeholder="••••••" autofocus>
      </div>
      <button type="button" id="omni-btn-verify" class="omni-btn omni-btn-success">Verify &amp; Sign In</button>

      <div class="omni-timer-row">
        <span id="omni-countdown">Expires in: 05:00</span>
        <button type="button" id="omni-btn-resend" class="omni-resend-btn" disabled>Resend Code</button>
      </div>
    </div>

    <!-- Feedback banner -->
    <div id="omni-status" class="omni-alert"></div>
  </div>

  <script>
    /**
     * OmniOTP Website Widget Controller
     * Configure your API Endpoint & Platform Key below:
     */
    const OMNI_CONFIG = {
      // Deployed API URL (Cloudflare Worker, Node VPS, or local server)
      apiBaseUrl: window.location.origin, 
      // Platform API Key generated in your OmniOTP Dashboard
      platformApiKey: 'sk_live_omni_7a9f4c82b1d3e6',
      appName: 'My Website'
    };

    let activeSessionId = null;
    let timerInterval = null;

    const phoneStep = document.getElementById('omni-step-phone');
    const verifyStep = document.getElementById('omni-step-verify');
    const phoneInput = document.getElementById('omni-phone');
    const otpInput = document.getElementById('omni-otp');
    const btnSend = document.getElementById('omni-btn-send');
    const btnVerify = document.getElementById('omni-btn-verify');
    const btnResend = document.getElementById('omni-btn-resend');
    const timerEl = document.getElementById('omni-countdown');
    const statusEl = document.getElementById('omni-status');

    function showStatus(text, type = 'success') {
      statusEl.textContent = text;
      statusEl.className = 'omni-alert ' + type;
      statusEl.style.display = 'block';
    }

    // 1. Send OTP
    btnSend.addEventListener('click', async () => {
      let phone = phoneInput.value.trim().replace(/[\s\-\(\)]/g, '');
      if (phone.length === 10) phone = '+91' + phone;
      if (!phone.startsWith('+')) phone = '+' + phone;

      btnSend.disabled = true;
      btnSend.textContent = 'Dispatching SMS...';

      try {
        const res = await fetch(`${OMNI_CONFIG.apiBaseUrl}/api/v1/otp/send`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-api-key': OMNI_CONFIG.platformApiKey
          },
          body: JSON.stringify({
            phone: phone,
            app_name: OMNI_CONFIG.appName,
            length: 6,
            expiry_minutes: 5
          })
        });

        const data = await res.json();
        if (res.ok && data.success) {
          activeSessionId = data.session_id;
          phoneStep.style.display = 'none';
          verifyStep.style.display = 'block';
          showStatus('✓ Passcode sent via SMS to ' + phone, 'success');
          startTimer(300);
          otpInput.focus();
        } else {
          showStatus(data.error || 'Failed to dispatch SMS', 'error');
        }
      } catch (e) {
        showStatus('Network error: ' + e.message, 'error');
      } finally {
        btnSend.disabled = false;
        btnSend.textContent = 'Send Verification OTP';
      }
    });

    // 2. Verify OTP
    btnVerify.addEventListener('click', async () => {
      const code = otpInput.value.trim();
      if (code.length < 4) {
        showStatus('Please enter the verification code', 'error');
        return;
      }

      btnVerify.disabled = true;
      btnVerify.textContent = 'Verifying...';

      try {
        const res = await fetch(`${OMNI_CONFIG.apiBaseUrl}/api/v1/otp/verify`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-api-key': OMNI_CONFIG.platformApiKey
          },
          body: JSON.stringify({
            session_id: activeSessionId,
            otp: code
          })
        });

        const data = await res.json();
        if (res.ok && data.verified) {
          showStatus('🎉 Phone verified successfully! Logging you in...', 'success');
          clearInterval(timerInterval);
          setTimeout(() => {
            alert('Authentication successful! Welcome to ' + OMNI_CONFIG.appName);
          }, 600);
        } else {
          showStatus(data.error || 'Incorrect OTP code', 'error');
        }
      } catch (e) {
        showStatus('Verification error: ' + e.message, 'error');
      } finally {
        btnVerify.disabled = false;
        btnVerify.textContent = 'Verify & Sign In';
      }
    });

    // Countdown Timer
    function startTimer(durationSeconds) {
      clearInterval(timerInterval);
      let remain = durationSeconds;
      btnResend.disabled = true;

      timerInterval = setInterval(() => {
        remain--;
        const mins = Math.floor(remain / 60).toString().padStart(2, '0');
        const secs = (remain % 60).toString().padStart(2, '0');
        timerEl.textContent = `Expires in: ${mins}:${secs}`;

        if (remain <= 240) { // Enable resend after 60s
          btnResend.disabled = false;
        }

        if (remain <= 0) {
          clearInterval(timerInterval);
          timerEl.textContent = 'Code expired';
          showStatus('Passcode expired. Please request a new code.', 'error');
        }
      }, 1000);
    }

    btnResend.addEventListener('click', () => {
      btnSend.click();
    });
  </script>
</body>
</html>
